# Starship config — ArchDroid Nord
# Baseado em: terminal-setup-briefing.md
# Powerline style: segmentos com bg diferentes criam o separador ► automaticamente

# ── Layout ──
# Linha 1: [OS user@host] [dir] [git]               [time] [duração]
# Linha 2: ❯
add_newline = false

format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$fill\
$time\
$cmd_duration\
$line_break\
$character"""

# ── Linha 1 — Esquerda ──
# Identidade: OS icon + usuário@hostname
# bg: nord10 (#5E81AC) · fg: nord0 (#2E3440)

[os]
disabled = false
style = "bg:#5E81AC fg:#2E3440"
format = "[ $symbol ](bg:#5E81AC fg:#2E3440)"

[username]
show_always = true
style_user = "bg:#5E81AC fg:#2E3440"
style_root = "bg:#5E81AC fg:#2E3440"
format = "[$user@$hostname](bg:#5E81AC fg:#2E3440)"

# Localização: ícone pasta + path
# bg: nord9 (#81A1C1) · fg: nord0 (#2E3440)
[directory]
style = "bg:#81A1C1 fg:#2E3440"
format = "[ 󰉋 $path ](bg:#81A1C1 fg:#2E3440)"
truncation_length = 3
truncation_symbol = "…/"

# Git: branch + status inline
# bg: nord8 (#88C0D0) · fg: nord0 (#2E3440)
[git_branch]
style = "bg:#88C0D0 fg:#2E3440"
format = "[ 󰘬 $branch ](bg:#88C0D0 fg:#2E3440)"
only_attached = true

[git_status]
style = "bg:#88C0D0 fg:#2E3440"
format = "[$all_status$ahead_behind](bg:#88C0D0 fg:#2E3440)"
conflicted = "🏳"
staged = "[++](green)"
modified = "[✎](yellow)"
stashed = "[●](purple)"
deleted = "[✗](red)"
renamed = "[→](blue)"
untracked = "[?](white)"
ahead = " ↑"
behind = " ↓"
diverged = " ⇕"

# ── Preenchimento ──
# Empurra time + cmd_duration pra extrema direita
[fill]
symbol = " "

# ── Linha 1 — Direita ──
# Horário
# bg: nord3 (#4C566A) · fg: nord4 (#D8DEE9)
[time]
disabled = false
style = "bg:#4C566A fg:#D8DEE9"
format = "[ $time ](bg:#4C566A fg:#D8DEE9)"
time_format = "%H:%M"

# Duração do último comando (só >2s)
# bg: nord1 (#3B4252) · fg: nord8 (#88C0D0)
[cmd_duration]
style = "bg:#3B4252 fg:#88C0D0"
format = "[ 󰔚 $duration ](bg:#3B4252 fg:#88C0D0)"
min_time = 2000
show_milliseconds = false

# ── Linha 2 — Cursor ──
[character]
success_symbol = "[❯](bold #A3BE8C)"
error_symbol = "[❯](bold #BF616A)"
format = "$symbol "

# ── Módulos excluídos ──
[python]
disabled = true

[nodejs]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[battery]
disabled = true

[docker]
disabled = true

[kubernetes]
disabled = true
