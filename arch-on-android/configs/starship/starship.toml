# Starship config — ArchDroid Nord (Powerline)
# Baseado em: terminal-setup-briefing.md
# Referência: psychonaut/2a4cad144444712310940231d1e2b8a8 (Nord agnoster/powerline)
# Powerline: separadores manuais [](fg:BG_ANTERIOR bg:BG_PROXIMO)
#  = U+E0B0 (Powerline triangle right-pointing)
# Fonte: JetBrains Mono Nerd Font (necessária para ícones e )

add_newline = false

format = """
[](bg:inverted fg:#5E81AC)\
$os\
$username\
$hostname\
[](fg:#5E81AC bg:#81A1C1)\
$directory\
[](fg:#81A1C1 bg:#88C0D0)\
$git_branch\
$git_status\
[](fg:#88C0D0)\
$fill\
[](fg:#4C566A)\
$time\
[](fg:#4C566A bg:#3B4252)\
$cmd_duration\
[](fg:#3B4252)\
$line_break\
$character"""

# ═══════════════════════════════════════════
# Linha 1 — Esquerda
# ═══════════════════════════════════════════

# Segmento 1 — Identidade (OS + usuário + hostname)
# Fundo: nord10 (#5E81AC) · Texto: nord0 (#2E3440)

[os]
disabled = false
style = "bg:#5E81AC fg:#2E3440"
format = "[ $symbol ](bg:#5E81AC fg:#2E3440)"

[username]
show_always = true
style_user = "bg:#5E81AC fg:#2E3440"
style_root = "bg:#5E81AC fg:#2E3440"
format = "[$user](bg:#5E81AC fg:#2E3440)"

[hostname]
disabled = false
ssh_only = false
style = "bg:#5E81AC fg:#2E3440"
format = "[@$hostname](bg:#5E81AC fg:#2E3440)"
ssh_symbol = "󰢩"
trim_at = "."

# Segmento 2 — Diretório
# Fundo: nord9 (#81A1C1) · Texto: nord0 (#2E3440)
[directory]
style = "bg:#81A1C1 fg:#2E3440"
format = "[ 󰉋 $path ](bg:#81A1C1 fg:#2E3440)"
truncation_length = 3
truncation_symbol = "…/"

# Segmento 3 — Git (branch + status inline)
# Fundo: nord8 (#88C0D0) · Texto: nord0 (#2E3440)
[git_branch]
style = "bg:#88C0D0 fg:#2E3440"
format = "[ 󰘬 $branch ](bg:#88C0D0 fg:#2E3440)"
only_attached = true

[git_status]
style = "bg:#88C0D0 fg:#2E3440"
format = "[$all_status$ahead_behind](bg:#88C0D0 fg:#2E3440)"
conflicted = "🏳"
staged = "[++](green)"
modified = "[✎](yellow)"
stashed = "[●](purple)"
deleted = "[✗](red)"
renamed = "[→](blue)"
untracked = "[?](white)"
ahead = " ↑"
behind = " ↓"
diverged = " ⇕"

# ═══════════════════════════════════════════
# Preenchimento (empurra time+duracao pra direita)
# ═══════════════════════════════════════════

[fill]
symbol = " "

# ═══════════════════════════════════════════
# Linha 1 — Direita
# ═══════════════════════════════════════════

# Segmento 4 — Horário
# Fundo: nord3 (#4C566A) · Texto: nord4 (#D8DEE9)
[time]
disabled = false
style = "bg:#4C566A fg:#D8DEE9"
format = "[ $time ](bg:#4C566A fg:#D8DEE9)"
time_format = "%H:%M"

# Segmento 5 — Duração do último comando (>2s)
# Fundo: nord1 (#3B4252) · Texto: nord8 (#88C0D0)
[cmd_duration]
style = "bg:#3B4252 fg:#88C0D0"
format = "[ 󰔚 $duration ](bg:#3B4252 fg:#88C0D0)"
min_time = 2000
show_milliseconds = false

# ═══════════════════════════════════════════
# Linha 2 — Cursor
# ═══════════════════════════════════════════

[character]
success_symbol = "[❯](bold #A3BE8C)"
error_symbol = "[❯](bold #BF616A)"
format = "$symbol "

# ═══════════════════════════════════════════
# Módulos excluídos (ruído para o perfil)
# ═══════════════════════════════════════════

[python]
disabled = true

[nodejs]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[battery]
disabled = true

[docker]
disabled = true

[kubernetes]
disabled = true
