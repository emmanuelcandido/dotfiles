# ──────────────────────────────────────────────
# tmux.conf — ArchDroid (Android / Termux proot)
# ──────────────────────────────────────────────

# ── Mouse ──
# Desligado pra não entrar em copy mode com clique acidental
set -g mouse off

# Atalhos pra ligar/desligar na hora:
#   Prefix + m = liga mouse
#   Prefix + M = desliga mouse
bind m set -g mouse on  \; display "🐭 Mouse ON"
bind M set -g mouse off \; display "🐭 Mouse OFF"

# ── Keys ──
# Força vi mode pra consistência (evita surpresa)
set -g mode-keys vi
set -g status-keys vi

# ── Desabilitar prompts que PRENDEM no copy mode ──
# Se vc entrar neles, fica sem conseguir sair — melhor não ter

# ":" no copy-mode — abre prompt pra digitar comandos como goto-line / jump-to
unbind-key -T copy-mode-vi :
unbind-key -T copy-mode   :

# "g" e "G" — abrem prompt "goto-line" no modo vi
unbind-key -T copy-mode-vi g
unbind-key -T copy-mode-vi G

# "f" e "F" — "jump-forward/backward to character" (abre prompt)
unbind-key -T copy-mode-vi f
unbind-key -T copy-mode-vi F

# "t" e "T" — "jump-to before character" (abre prompt)
unbind-key -T copy-mode-vi t
unbind-key -T copy-mode-vi T

# "/" e "?" — busca (não prende tanto, mas desabilite se quiser)
# unbind-key -T copy-mode-vi /
# unbind-key -T copy-mode-vi ?

# ── Escape hatch garantido ──
# "q" SEMPRE sai do copy mode (padrão tmux, reforço aqui)
# Se vc entrar em copy mode sem querer: q

# ── Prefere scroll normal, não copy mode ──
# Se quiser navegar no histórico, use:
#   Prefix + [  (entra em copy mode)
#   q           (sai)
#   Page Up / Page Down (se mouse off)
